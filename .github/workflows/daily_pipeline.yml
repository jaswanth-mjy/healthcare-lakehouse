name: Daily Hospital Pipeline

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas dbt-core dbt-duckdb duckdb

      - name: Run Bronze ingestion
        run: python scripts/ingest_bronze.py

      - name: Run data quality checks
        run: python tests/ge_hospital_suite.py

      - name: Setup DuckDB bronze view with absolute path
        run: |
          python3 << 'PYEOF'
          import duckdb, glob, os
          root = os.getcwd()
          conn = duckdb.connect(os.path.join(root, "healthcare.duckdb"))
          conn.execute("CREATE SCHEMA IF NOT EXISTS bronze")
          files = glob.glob(os.path.join(root, "bronze/hospitals/ingestion_date=*/hospitals.json"))
          if not files:
              raise FileNotFoundError("No Bronze hospitals.json files found after ingestion")
          latest = max(files, key=os.path.getmtime)
          conn.execute(f"CREATE OR REPLACE VIEW bronze.hospitals AS SELECT * FROM read_json_auto('{latest.replace(\"'\", \"''\")}')")
          print(f"✓ View created from {latest}")
          conn.close()
          PYEOF

      - name: Run dbt
        run: |
          cd healthcare_dbt
          dbt deps
          dbt run --profiles-dir .
          dbt test --profiles-dir .

      - name: Log success
        run: echo "✅ Pipeline completed $(date)"
